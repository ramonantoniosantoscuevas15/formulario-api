<app-listado-generico [listado]="pacientes">

  <ng-container contenido>
    <div class="space-y-3">




      @for (paciente of pacientes; track $index) {
      <a id="lista" class="group block bg-card rounded-2xl
     border border-border p-5 hover:shadow-lg
     hover:border-primary/20 transition-all duration-300">


        <div class="flex items-start justify-between">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-blue-500 flex items-center justify-center text-primary font-semibold text-lg shrink-0">
              {{paciente.nombre.substring(0,1)}}

            </div>
            <div class="min-w-0">
              <h3 class="font-semibold text-foreground truncate group-hover:text-primary
              transition-colors">{{paciente.nombre}}</h3>

            </div>
            <div class="flex items-center gap-3 mt-1 text-sm text-muted-foreground">
              <span class="capitalize">{{paciente.genero}}</span>
              <span class="flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-droplets w-3 h-3">
                  <path d="M7 16.3c2.2 0 4-1.83
               4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7
               5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z">

                  </path>
                  <path d="M12.56 6.6A10.97
               10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4
               6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97">

                  </path>

                </svg>
                {{paciente.sangre}}</span>

            </div>
            <div class="flex items-center gap-3 shrink-0">
              <div class="inline-flex items-center rounded-md border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2
        focus:ring-ring focus:ring-offset-2
        border-transparent shadow bg-green-500  hover:bg-green-500 bg-accent text-accent-foreground">
                {{paciente.estado}}

              </div>
              <span>

                <a [routerLink]="['/paciente/editar/',paciente.id]">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-chevron-right w-4 h-4 text-muted-foreground group-hover:text-primary transition-colors">
                    <path d="m9 18 6-6-6-6">

                    </path>


                  </svg>
                </a>

              </span>

            </div>



          </div>


        </div>
        <div class="flex items-center gap-4 mt-3 pt-3 border-t border-border text-xs text-muted-foreground">
          <span class="flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-phone w-3 h-3">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45
            2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">

              </path>

            </svg>
            {{paciente.telefono}}

          </span>
          <span class="flex items-center gap-1 truncate">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-mail w-3 h-3">
              <rect width="20" height="16" x="2" y="4" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>

            </svg>
            {{paciente.correo}}

          </span>

        </div>





      </a>
      }


    </div>


  </ng-container>


</app-listado-generico>
