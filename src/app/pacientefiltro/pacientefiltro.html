<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="space-y-6">
    <div id="lista" class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Pacientes</h1>
      </div>
      <a routerLink="/pacientes">
        <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none
        [&_svg]:size-4 [&_svg]:shrink-0 bg-blue-500 text-primary-foreground shadow hover:bg-blue-500 py-2 h-11 px-6"
        >
        <svg xmlns="http://www.w3.org/2000/svg"
        width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus w-4 h-4 mr-2"
        >
        <path d="M5 12h14"></path>
        <path d="M12 5v14"></path>

        </svg>
        Nuevo

        </button>
      </a>

    </div>

  </div>
  <form [formGroup]="form">
    <div class="flex flex-col sm:flex-row gap-3">
    <div class="relative flex-1">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"
       >
       <circle cx="11" cy="11" r="8"></circle>
       <path d="m21 21-4.3-4.3"></path>

      </svg>
      <input [formControl]="form.controls.nombre" class="flex w-full rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none
      focus-visible:ring-1 focus-visible:ring-ring
      disabled:cursor-not-allowed disabled:opacity-50 md:text-sm pl-10 h-11" placeholder="Buscar Paciente por Nombre"/>


    </div>


  </div>


  </form>

    <app-listado-pacientes [pacientes]="paciente"></app-listado-pacientes>



  <mat-paginator showFirstLastButtons [length]="cantidadTotalRegistros" [pageIndex]="paginacion.pagina-1"
[pageSize]="paginacion.recordsPorPagina" [pageSizeOptions]="[5, 10, 50]" class="mat-elevation-z8"
(page)="actualizarPaginacion($event)">

</mat-paginator>




</main>
