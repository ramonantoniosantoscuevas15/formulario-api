<div class="space-y-8">
  <div class="bg-card rounded-2xl border border-border shadow-sm">
    <div class="flex items-center justify-between p-6 pb-4">
      <h2 class="text-lg font-semibold">Pacientes Recientes</h2>
      <a class="text-sm text-blue-400 hover:underline flex items-center gap-1" routerLink="/buscarpaciente">Ver Todos
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2" stroke-linejoin="round" class="lucide lucide-chevron-right w-3 h-3">
        <path d="m9 18 6-6-6-6"></path>

        </svg>
      </a>

    </div>
    <app-listado-generico [listado]="pacientes">
      <ng-container contenido>
        @for (paciente of pacientes; track $index) {
          <div class="divide-y divide-border">
            <a class="flex items-center gap-4 px-6 py-4 hover:bg-mist-300 transition-colors" [routerLink]="['/paciente/editar/',paciente.id]">
              <div class="w-12 h-12 rounded-xl bg-blue-500 flex items-center justify-center text-primary font-semibold text-lg shrink-0">
                {{paciente.nombre.substring(0,1)}}

              </div>
              <div class="min-w-0 flex-1">
                <p class="font-medium truncate">{{paciente.nombre}}</p>

              </div>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right w-4 h-4 text-muted-foreground">
               <path d="m9 18 6-6-6-6"></path>

              </svg>

            </a>

          </div>

        }

      </ng-container>
    </app-listado-generico>


  </div>

</div>
